name: ClawSweeper native canary

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact open pull request number to review
        required: true
        type: string
      expected_base_sha:
        description: Exact current main SHA to review against
        required: true
        type: string
      expected_head_sha:
        description: Exact pull request head SHA to review
        required: true
        type: string
      publish:
        description: Publish the native comment, labels, and durable state record
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  clawsweeper:
    name: Run pinned native ClawSweeper
    permissions: {}
    uses: dinkuskit/clawsweeper/.github/workflows/dinkuskit-native-canary.yml@d01c55c5faf57b09d08de55fe55581cdfa3f8352
    with:
      target_repository: template-services
      target_repository_id: "1306882701"
      pr_number: ${{ inputs.pr_number }}
      expected_base_sha: ${{ inputs.expected_base_sha }}
      expected_head_sha: ${{ inputs.expected_head_sha }}
      publish: ${{ inputs.publish }}
    secrets:
      CLAWSWEEPER_DISPATCH_TOKEN: ${{ secrets.CLAWSWEEPER_DISPATCH_TOKEN }}
